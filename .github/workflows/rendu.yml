# Regénère le rendu statique du registre à chaque commit et le publie :
#  - sur la branche site (vitrine immédiate, rien n'exécute côté serveur) ;
#  - en SFTP vers le vhost Gandi de portemann.eu (vitrine publique).
# Le registre canonique reste REGISTRE.jsonl sur main ; la page est un
# fichier produit par le dépôt. Les identifiants vivent dans les secrets
# GitHub du dépôt (jamais dans le dépôt lui-même).
name: rendu-registre
on:
  push:
    branches: [main]
    paths: ['REGISTRE.jsonl', 'site/rendu_statique.py', '.github/workflows/rendu.yml']

permissions:
  contents: write

jobs:
  rendu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Générer le rendu statique
        run: python site/rendu_statique.py registre.html
      - name: Publier sur la branche site (vitrine immédiate)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: site
          keep_files: false
          exclude_assets: ''
      - name: Déployer sur portemann.eu (Gandi, vhost registre)
        uses: wlixcc/SFTP-Deploy-Action@v2.0.0
        with:
          server: sftp.sd3.gpaas.net
          username: ${{ secrets.GANDI_SFTP_USER }}
          password: ${{ secrets.GANDI_SFTP_PASSWORD }}
          local_path: './registre.html'
          remote_path: './vhosts/registre.portemann.eu/'
          sftpOnly: true
