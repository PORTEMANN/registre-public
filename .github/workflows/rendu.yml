# Regénère le rendu statique du registre à chaque commit et le publie :
#  - sur la branche site (vitrine immédiate GitHub, rien n'exécute
#    côté serveur) ;
#  - sur Gandi par push-to-deploy (mécanisme natif : git push sur le
#    remote gandi + commande deploy), authentifié par une clé SSH
#    DEDIÉE au déploiement (jamais le mot de passe de l'instance) —
#    la clé privée vit dans le secret GANDI_DEPLOY_KEY, révocable
#    indépendamment chez Gandi.
# Le registre canonique reste REGISTRE.jsonl sur main ; la page est un
# fichier produit par le dépôt.
name: rendu-registre
on:
  push:
    branches: [main]
    paths: ['REGISTRE.jsonl', 'site/rendu_statique.py', '.github/workflows/rendu.yml']

permissions:
  contents: write

jobs:
  rendu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Générer le rendu statique
        run: python site/rendu_statique.py registre.html
      - name: Publier sur la branche site (vitrine immédiate)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: site
          keep_files: false
          exclude_assets: ''
      - name: Déployer sur portemann.eu (Gandi, push-to-deploy)
        env:
          GANDI_DEPLOY_KEY: ${{ secrets.GANDI_DEPLOY_KEY }}
          GANDI_USER: "9daa0556-c07b-11e7-9d8f-00163e6dc886"
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$GANDI_DEPLOY_KEY" > ~/.ssh/id_ed25519.raw
          # sanitizer : ne garder que le bloc BEGIN/END (tolère les lignes
          # parasites d'un collage : balises, lignes vides) — mesuré le
          # 2026-11-01 : 7 lignes collées -> libcrypto refuse, 5 lignes -> OK
          sed -n '/BEGIN OPENSSH PRIVATE KEY/,/END OPENSSH PRIVATE KEY/p' ~/.ssh/id_ed25519.raw > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "lignes de cle: $(wc -l < ~/.ssh/id_ed25519)"
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null && echo "CLE_OK" || { echo "CLE_KO"; exit 1; }
          ssh-keyscan -H git.sd3.gpaas.net >> ~/.ssh/known_hosts 2>/dev/null
          # deploiement autonome : depot minimal dans un dossier temporaire
          # (independant de l'etat du workspace apres l'etape gh-pages)
          TMP=$(mktemp -d)
          cd "$TMP"
          git init -q
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          mkdir -p htdocs
          cp "$GITHUB_WORKSPACE/registre.html" htdocs/index.html
          git add htdocs/index.html
          git commit -m "registre.html (rendu automatique)"
          git branch -M master
          git remote add gandi "git+ssh://${GANDI_USER}@git.sd3.gpaas.net/registre.portemann.eu.git"
          git push -f gandi master
          ssh -o StrictHostKeyChecking=accept-new "${GANDI_USER}@git.sd3.gpaas.net" deploy registre.portemann.eu.git

# 2026-11-01 : cle dediee Gandi installee (paire ed25519 generee a cet effet).

